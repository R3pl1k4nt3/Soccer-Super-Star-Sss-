<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estrella del Balón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Mundo único: azul noche y burdeos, con oro para estrellas y medallas. Lista densa de filas, como un panel de club. */
:root{
  --bg:#0b1431;
  --bg2:#2a1233;
  --panel:rgba(255,255,255,.07);
  --panel2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --txt:#eef1fb;
  --mut:#9aa6c8;
  --gold:#f3c244;
  --good:#52d38b;
  --bad:#ff6b6b;
  --btn:#e5524f;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:linear-gradient(135deg,var(--bg) 0%,#1a1740 55%,var(--bg2) 100%);background-attachment:fixed;color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.35;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:600;letter-spacing:.02em;text-wrap:balance}
/* barra superior */
#top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:rgba(8,12,34,.7);border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-size:22px;font-weight:600}
.stat small{font-family:var(--fb);font-size:11px;color:var(--mut);font-weight:400}
.star{color:var(--gold)}
.money{color:var(--good)}
.medal{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a1d 70%);border:2px solid #f6d36b;vertical-align:-2px;position:relative}
.medal:after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid #b9780f}
.when{margin-left:auto;text-align:right;font-size:12px;color:var(--mut);line-height:1.2}
.when b{display:block;color:var(--txt);font-size:13px;font-weight:600}
/* vista */
#view{flex:1;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:20px;margin-bottom:8px}
.card h3{font-size:16px;color:var(--gold);margin-bottom:6px}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut)}
.small{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}
.bar{position:relative;height:22px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4d5f9a,#7b8dc9);border-radius:6px}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.bar.big{height:12px;margin-top:6px}
.bar.en i{background:linear-gradient(90deg,#2f9e6a,#52d38b)}
.bar.low i{background:linear-gradient(90deg,#c44,#ff6b6b)}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px}
.chip.on{background:var(--gold);color:#241a00;border-color:var(--gold)}
.mults{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
/* entrenamiento */
.hdr{display:grid;grid-template-columns:84px 1fr 72px;gap:8px;font-family:var(--fd);font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:0 2px 4px}
.hdr span:last-child{text-align:center}.hdr span:first-child{text-align:center}
.sk{display:grid;grid-template-columns:84px 1fr 72px;gap:8px;margin-bottom:8px;align-items:stretch}
.tr,.pr{border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--fd);font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;min-height:58px}
.tr .star{font-size:16px;line-height:1}
.tr:active,.pr:active,.go:active{transform:scale(.97)}
.tr.dis,.pr.dis{opacity:.45}
.pr{color:#ffb0a8}
.mid{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.nm{display:flex;align-items:center;gap:6px;font-weight:500;flex-wrap:wrap}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars em{color:rgba(255,255,255,.18);font-style:normal}
.val{margin-left:auto;font-family:var(--fd);font-size:18px;color:var(--gold)}
.lv{font-size:11px;color:var(--mut)}
.bono{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:stretch;margin-top:12px}
.go{background:var(--btn);border-radius:10px;font-family:var(--fd);font-size:20px;font-weight:600;padding:10px 12px;color:#fff}
.go.alt{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.go.dis{opacity:.45}
.go.block{width:100%}
/* partido */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:6px 0 10px}
.vs b{font-family:var(--fd);font-size:19px;font-weight:600;line-height:1.1}
.score{font-family:var(--fd);font-size:44px;font-weight:700;letter-spacing:.04em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .full{grid-column:1/-1}
.ev{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.ev b{width:34px;font-family:var(--fd);color:var(--gold);font-size:16px}
.me{color:var(--gold);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kv div{background:var(--panel);border-radius:8px;padding:6px 8px;text-align:center}
.kv b{display:block;font-family:var(--fd);font-size:20px;font-weight:600}
.kv span{font-size:11px;color:var(--mut)}
/* tablas */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--fd);font-weight:500;color:var(--mut);text-align:right;padding:4px 6px;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
td{padding:6px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.mine td{background:rgba(243,194,68,.16);font-weight:600}
.tw{overflow-x:auto}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.item .go{font-size:17px;padding:8px 12px;min-width:92px}
/* nav */
#nav{display:grid;grid-template-columns:repeat(8,1fr);background:rgba(8,12,34,.92);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{padding:11px 0 10px;font-family:var(--fd);font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--mut);border-top:3px solid transparent}
#nav button.on{color:var(--gold);border-top-color:var(--gold);background:rgba(255,255,255,.05)}
/* avisos */
#toasts{position:absolute;top:70px;left:16px;right:16px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:30}
.toast{background:#101a40;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:in .2s ease-out}
.toast.err{border-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.modal{position:absolute;inset:0;background:rgba(5,8,24,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{max-width:480px;width:100%;max-height:92%;overflow-y:auto;background:#141c44;margin:0}
.setup{padding:calc(env(safe-area-inset-top) + 28px) 20px 20px;overflow-y:auto;height:100%}
.setup h1{font-size:44px;line-height:1;color:var(--gold);margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 4px}
input,select{width:100%;font:inherit;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
select option{background:#141c44}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>

<script>

 ['mar','Marcaje','def'],['ent','Entradas','def'],['ant','Anticipación','def'],['pos','Posicionamiento','def'],
 ['pas','Pase corto','med'],['pal','Pase largo','med'],['vis','Visión','med'],['ctl','Control del balón','med'],['bpa','Balón parado','med'],
 ['tir','Tiro','ata'],['fin','Finalización','ata'],['reg','Regate','ata'],['cab','Remate de cabeza','ata'],['cen','Centros','ata'],['des','Desmarque','ata']];

 ['ace','Aceleración','fis'],['agi','Agilidad','fis'],['fue','Fuerza','fis'],['sal','Salto','fis'],
 ['arr','Arrojo','def'],['cap','Captura','def'],['ref','Reflejos','def'],['pos','Posicionamiento','def'],['aer','Juego aéreo','def'],['uno','Mano a mano','def'],
 ['sac','Saque','med'],['pal','Pase largo','med'],['pas','Pase con el pie','med']];
/* peso base por categoría [men,fis,def,med,ata] y por habilidad concreta */
var CATW={POR:[2,2,3,1,0],DFC:[3,3,3,2,1],LI:[2,3,3,2,2],LD:[2,3,3,2,2],MCD:[3,3,3,3,1],MC:[3,2,2,4,2],VI:[2,3,2,3,3],VD:[2,3,2,3,3],MP:[2,2,1,3,3],SD:[2,3,1,2,3],DC:[2,3,1,1,3],EI:[2,3,1,2,3],ED:[2,3,1,2,3]};
var EMP={POR:{arr:4,cap:4,ref:4,pos:3,uno:3,sac:2,con:3},DFC:{mar:4,ent:4,ant:4,pos:4,sal:3,cab:3,fue:3},
 LI:{cen:4,res:4,ace:4,vel:3,mar:3,ent:3},LD:{cen:4,res:4,ace:4,vel:3,mar:3,ent:3},MCD:{ent:4,mar:3,ant:4,pas:3,res:4,fue:3},
 MC:{pas:4,vis:4,ctl:4,res:3},VI:{res:4,pas:3,cen:3,reg:3,vis:3,ace:3},VD:{res:4,pas:3,cen:3,reg:3,vis:3,ace:3},
 MP:{vis:4,ctl:4,reg:4,pas:4,fin:3,tir:3,des:3},SD:{fin:4,des:4,tir:4,reg:3,ace:3,vel:3},DC:{fin:4,cab:4,tir:4,fue:3,des:3,sal:3},

function catName(c){if(S&&S.pos==='POR'){if(c==='def')return 'Portería';if(c==='med')return 'Distribución';}for(var i=0;i<CATS.length;i++)if(CATS[i][0]===c)return CATS[i][1];return c;}

 {id:'reg',n:'Regateador excepcional',d:'Desborda con facilidad. Más ocasiones y mejor nota.',sk:['reg','ctl','agi'],fx:{rate:.2,gs:.1,as:.1}},

 {id:'centr',n:'Centrador letal',d:'Tus centros acaban en gol.',sk:['cen','pal'],fx:{as:.45}},

 {id:'grande',n:'Jugador de partidos grandes',d:'Subes tu nivel cuando más importa.',sk:['cfz','cst','dec'],fx:{rate:.25}},
 {id:'gato',n:'Gato bajo palos',d:'Paradas imposibles. Evitas más goles.',gk:1,sk:['ref','agi','arr'],fx:{cancel:.15}},

 {id:'paran',n:'Parapenaltis',d:'Dominas el uno contra uno.',gk:1,sk:['uno','ref','cfz'],fx:{cancel:.12}},
 {id:'gral',n:'General de la defensa',d:'Ordenas a tu defensa y mejora tu equipo.',gk:1,sk:['com','pos','aer'],fx:{cancel:.08,team:1.2}}
];
function traitById(id){for(var i=0;i<TRAITS.length;i++)if(TRAITS[i].id===id)return TRAITS[i];return null;}

/* utilidades */
var $=function(s){return document.querySelector(s);};
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function norm(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function poisson(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){n=Math.round(n);var a=Math.abs(n);if(a>=1e6)return '€'+(+(n/1e6).toFixed(2))+'M';if(a>=1e3)return '€'+(+(n/1e3).toFixed(a<1e4?1:0))+'k';return '€'+n;}
function ds(x,d){return (+x).toFixed(d==null?1:d).replace('.',',');}
function toast(m,err){var t={m:m,err:!!err,id:Math.random()};toasts.push(t);if(toasts.length>3)toasts.shift();render();setTimeout(function(){toasts=toasts.filter(function(x){return x!==t;});render();},2600);}
function logm(m){S.log.unshift({t:'T'+S.season+' · J'+S.week,m:m});if(S.log.length>50)S.log.length=50;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===3)return o;}}catch(e){}return null;}

/* habilidades */
function need(l){return 8+3*l;}
function overall(){var sw=0,s=0;S.skills.forEach(function(k){sw+=k.w;s+=k.w*skVal(k);});return s/sw;}
function pointCost(k,lvl){return (k.w>=3?12000:4000)*(1+0.25*(lvl-1));}
function wageFor(str,ov){var m=clamp((ov||str)/str,0.75,1.35);return Math.round(4000*Math.exp((str-40)/14)*m*(1+0.12*itemLvl('agent'))*(1+(S.rel.board-50)*0.002)/100)*100;}
function itemLvl(id){return S.items[id]||0;}
function starterP(club){var rv=club.ros?rival(club):null,ref=rv?rv.o:club.str+2;return clamp(0.5+(overall()-ref+4)/22+(S.rel.coach-50)*0.004,0.04,1);}

/* liga */
function makeFixtures(n){var arr=[],i,rounds=[];for(i=0;i<n;i++)arr.push(i);
 for(var r=0;r<n-1;r++){var rd=[];for(i=0;i<n/2;i++){var a=arr[i],b=arr[n-1-i];rd.push((r+i)%2?[a,b]:[b,a]);}rounds.push(rd);arr.splice(1,0,arr.pop());}
 return rounds.concat(rounds.map(function(rd){return rd.map(function(m){return [m[1],m[0]];});}));}
function simScore(sH,sA){var d=sH+3-sA;return [poisson(1.4*Math.exp(d/35)),poisson(1.1*Math.exp(-d/35))];}
function record(H,A,gh,ga){H.pj++;A.pj++;H.gf+=gh;H.gc+=ga;A.gf+=ga;A.gc+=gh;if(gh>ga)H.pts+=3;else if(gh<ga)A.pts+=3;else{H.pts++;A.pts++;}}
function table(){return S.clubs.slice().sort(function(a,b){return b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||b.str-a.str;});}

/* nueva partida */
function newGame(name,pos,tp,ts){
 var clubs=CLUBS.map(function(c,i){return {id:i,name:c[0],str:c[1],pts:0,pj:0,gf:0,gc:0};});
 var start=pick(clubs.filter(function(c){return c.str<=43;}));
 var skills=newSkills(pos);clubs.forEach(genRoster);
 S={v:3,name:name,pos:pos,tp:tp,ts:ts,cat:defCat(pos),age:16,season:1,week:0,clubId:start.id,contract:{wage:0,years:3},money:60000,medals:5,energy:100,injured:0,bono:0,mult:1,skills:skills,clubs:clubs,fixtures:makeFixtures(20),offers:[],items:{},invest:{},deals:{},
  stats:{pj:0,min:0,g:0,a:0,cs:0,sv:0,rsum:0,rn:0,titles:0},ss:{pj:0,g:0,a:0,rsum:0,rn:0},hist:[],log:[],last:null,tab:'train',retired:false,summary:null,rel:{coach:50,team:50,press:50,fans:50,board:50},fol:300,fund:0,auto:false,match:null,event:null,acts:2,post:0};
 S.contract.wage=Math.round(wageFor(start.str)*0.8/100)*100;
 logm('Debutas con '+start.name+' a los 16 años. Salario semanal: '+fmt(S.contract.wage)+'.');
 genOffers();
 save();
}

/* ofertas */
function windowOpen(){return S.week<=3||(S.week>=19&&S.week<=21);}
function genOffers(){
 var ov=overall();
 var c=shuffle(S.clubs.filter(function(x){return x.id!==S.clubId&&x.str<=ov+20&&x.str>=ov-25;}));
 if(c.length<3){var rest=S.clubs.filter(function(x){return x.id!==S.clubId&&c.indexOf(x)<0;}).sort(function(a,b){return a.str-b.str;});c=c.concat(rest.slice(0,3-c.length));}
 S.offers=c.slice(0,3).map(function(x){var w=wageFor(x.str,ov);return {club:x.id,wage:w,years:1+Math.floor(Math.random()*4),bonus:w*4};});
}

/* partido */
function rel(k,v){S.rel[k]=clamp(Math.round((S.rel[k]+v)*10)/10,0,100);}
var SITS={POR:['Un delantero se planta solo ante ti.','Llega un centro peligroso al área.'],DEF:['El rival lanza un contraataque por tu zona.','Balón dividido en tu campo.'],MED:['Recibes de cara en el medio campo.','Se abre un hueco entre líneas.'],DEL:['Recibes en el borde del área.','Tienes espacio para encarar.']};
var PAY=[0.3,0.6,1],LOSS=[0.1,0.3,0.7];
function skAvg(sk){var s=0,n=0;sk.forEach(function(id){var k=S.skills.filter(function(x){return x.id===id;})[0];if(k){s+=skVal(k);n++;}});return n?s/n:30;}
function decP(o){return clamp(0.2+skAvg(o.sk)/120-0.1*o.rk-(S.energy<30?0.08:0)+(S.rel.coach-50)*0.001+traitDec(o),0.08,0.92);}
function resolveDec(M,d,oi){
 var o=d.opts[oi],ok=Math.random()<decP(o);d.done=oi;d.ok=ok;
 if(ok){M.dr+=PAY[o.rk];
  if(o.ef==='att'){if(Math.random()<[0.05,0.2,0.4][o.rk]){if(o.shot)M.mg++;else M.ma++;d.res='Termina en gol';}else d.res='Sale bien';}
  else{if(Math.random()<[0.2,0.35,0.5][o.rk]){M.dgc++;d.res='Evitas una ocasión clara';}else d.res='Sale bien';}}
 else{M.dr-=LOSS[o.rk];d.res='Sale mal';
  if(o.ef==='def'&&o.rk===2&&Math.random()<0.3){M.pen++;d.res='Penalti en contra';}}
}
function autoDec(M,d){var best=0,bv=-9;d.opts.forEach(function(o,i){var p=decP(o),v=p*PAY[o.rk]-(1-p)*LOSS[o.rk];if(v>bv){bv=v;best=i;}});resolveDec(M,d,best);}
function prepMatch(h,a){
 var me=S.clubs[S.clubId],home=h===S.clubId,opp=S.clubs[home?a:h],ov=overall(),pos=S.pos,P=POSD[pos];
 var role='fuera',mins=0;
 if(S.injured>0)role='lesionado';
 else if(Math.random()<starterP(me)){role='titular';mins=90;}
 else if(pos!=='POR'&&Math.random()<0.55){role='suplente';mins=Math.round(15+Math.random()*25);}
 else role='banquillo';
 var myStr=me.str+(mins>0?((ov-me.str)*0.1+(S.rel.team-50)*0.03+tx('team'))*(mins/90):0);
 var sc=home?simScore(myStr,opp.str):simScore(opp.str,myStr);
 var M={h:h,a:a,home:home,role:role,mins:mins,gh:sc[0],ga:sc[1],mg:0,ma:0,dr:0,dgc:0,pen:0,decs:[]};
 if(mins>0){var nd=mins>=60?2:1,st=90-mins,gk=pos==='POR'?'POR':P.line;
  for(var i=0;i<nd;i++)M.decs.push({min:st+3+Math.floor(Math.random()*(mins-6)),sit:pick(SITS[gk]),opts:shuffle(decOpts(pos)).slice(0,3),done:-1});
  M.decs.sort(function(x,y){return x.min-y.min;});}
 return M;
}
function playOne(pause){
 if(S.match)return null;
 var rd=S.fixtures[S.week],my=null,i;
 for(i=0;i<rd.length;i++){var h=rd[i][0],a=rd[i][1];
  if(h===S.clubId||a===S.clubId){my=rd[i];continue;}
  var sc=simScore(S.clubs[h].str,S.clubs[a].str);record(S.clubs[h],S.clubs[a],sc[0],sc[1]);}
 var M=prepMatch(my[0],my[1]);
 if(pause&&!S.auto&&M.decs.length){S.match=M;return null;}
 M.decs.forEach(function(d){autoDec(M,d);});
 return finishWeek(M);
}
function choose(oi){
 var M=S.match;if(!M)return;
 var d=M.decs.filter(function(x){return x.done<0;})[0];if(!d)return;
 resolveDec(M,d,oi);
 if(M.decs.every(function(x){return x.done>=0;})){S.match=null;finishWeek(M);}
 save();render();
}
function finishWeek(M){
 var rep=finishMatch(M);
 var inc=S.contract.wage;
 INVEST.forEach(function(v){if(S.invest[v.id])inc+=v.w;});
 DEALS.forEach(function(v){if(S.deals[v.id])inc+=v.w;});
 inc+=socialIncome();
 rep.income=inc+rep.bonus;S.money+=rep.income;
 if(S.fund>0){var ret=S.fund*(0.0025+norm()*0.012);S.fund=Math.max(0,Math.round(S.fund+ret));rep.fund=Math.round(ret);}
 S.energy=Math.min(100,S.energy+14+4*itemLvl('nutri'));
 if(S.injured>0)S.injured--;
 S.acts=2;S.post=0;
 if(!S.event&&Math.random()<0.3)newEvent();
 S.week++;S.last=rep;
 if(batch){batch.n++;batch.pts+=rep.pts;batch.money+=rep.income;batch.medals+=rep.medals;}
 if(S.week===19){genOffers();logm('Se abre el mercado de invierno. Revisa las ofertas en Club.');}
 if(S.week>=WEEKS)endSeason();
 return rep;
}
function socialIncome(){return Math.round(S.fol/1000*3*(0.7+S.rel.press/100));}
function finishMatch(M){
 var h=M.h,a=M.a,me=S.clubs[S.clubId],home=M.home,opp=S.clubs[home?M.a:M.h],ov=overall(),pos=S.pos,P=POSD[pos],mins=M.mins,role=M.role;
 var gf0=home?M.gh:M.ga,gc0=home?M.ga:M.gh;
 if(mins>0){if(Math.random()<tx('cancel')&&gc0>M.dgc)M.dgc++;if(tx('fk')&&Math.random()<0.06*(1+skv('bpa')/60)*tx('fk')*(mins/90)){M.mg++;M.fk=1;}}
 var gf=gf0+M.mg+M.ma,gc=Math.max(0,gc0-M.dgc)+M.pen;
 var gh=home?gf:gc,ga=home?gc:gf;
 record(S.clubs[h],S.clubs[a],gh,ga);
 var evs=[],j;
 for(j=0;j<gh;j++)evs.push({min:1+Math.floor(Math.random()*90),side:'h',txt:''});
 for(j=0;j<ga;j++)evs.push({min:1+Math.floor(Math.random()*90),side:'a',txt:''});
 evs.sort(function(x,y){return x.min-y.min;});
 var mine=evs.filter(function(e){return e.side===(home?'h':'a');});
 var g=M.mg,asi=M.ma,sh=0,saves=0;
 mine.forEach(function(e,i){
  if(i<M.mg){e.me='g';if(M.fk&&i===M.mg-1)e.fk=1;}else if(i<M.mg+M.ma)e.me='a';
  else if(mins>0){if(Math.random()<P.sg*(ov/55)*(mins/90)*(1+tx('gs'))){g++;e.me='g';}else if(Math.random()<P.sa*(ov/55)*(mins/90)*(1+tx('as'))){asi++;e.me='a';}}});
 if(pos==='POR'&&mins>0){sh=gc+poisson(2.8*Math.exp((opp.str-me.str)/60));saves=sh-gc;}

 evs.forEach(function(e){var ms=e.side===(home?'h':'a'),sc,as;
  if(ms){
   if(e.me==='g'){sc=esc(S.name)+' (tú)';as=e.fk?null:Math.random()<0.55?pickA(me,'').n:null;}
   else if(e.me==='a'){sc=pickP(me,'').n;as=esc(S.name)+' (tú)';}
   else{var pp=pickP(me,'');sc=pp.n;as=Math.random()<0.55?pickA(me,pp.n).n:null;}
   e.txt='Gol de '+sc+(e.fk?', de falta directa':'')+(as?' (asist. '+as+')':'');
  }else{e.txt='Gol de '+pickP(opp,'').n+' ('+opp.name+')';}});
 var r=0;
 if(mins>0){
  r=6+(ov-opp.str)*0.02+(gf>gc?0.4:gf<gc?-0.4:0)+norm()*0.65+S.bono*0.008+itemLvl('boots')*0.25+(S.rel.team-50)*0.004+tx('rate')+M.dr-(S.energy<30?0.6:0);
  if(pos==='POR'){r+=saves*0.18-gc*0.22+(gc===0?0.7:0);}
  else{r+=g*1.1+asi*0.6;if(P.df)r+=(gc===0?0.6:-0.15*gc);else if(P.line==='MED'&&gf>gc)r+=0.1;}
  if(mins<90)r=6+(r-6)*(0.4+0.6*mins/90);
  r=clamp(r,3.5,10);
 }
 var pts=0;
 if(mins>0)pts=Math.round((1+Math.max(0,r-5)*0.9+(gf>gc?1:0))*(0.45+0.55*mins/90)*(S.skills.length/8))+itemLvl('coach');
 else pts=Math.round(S.skills.length/8)+itemLvl('coach');
 var gains={},ups=[],tw=0;S.skills.forEach(function(k){tw+=k.w;});
 for(j=0;j<pts;j++){var x=Math.random()*tw,k=null,acc=0;for(var q=0;q<S.skills.length;q++){acc+=S.skills[q].w;if(x<acc){k=S.skills[q];break;}}
  if(!k||k.lvl>=capFor(k))continue;gains[k.n]=(gains[k.n]||0)+1;if(addProg(k,1))ups.push(k.n+' sube a nivel '+k.lvl);}
 ups.forEach(function(u){logm(u+'.');});
 var medals=0,bonus=0,w=S.contract.wage;
 if(mins>0){medals=(r>=7?1:0)+(r>=8.5?1:0)+(r>=9.5?1:0)+(gf>gc?1:0)+(r>=7?itemLvl('psico'):0);
  bonus=Math.round(Math.max(0,r-5)*400*Math.exp((me.str-40)/30))+(gf>gc?Math.round(w*0.15):0)+g*Math.round(w*0.4)+asi*Math.round(w*0.2)+((P.df||pos==='POR')&&gc===0&&mins>=60?Math.round(w*0.3):0);
  bonus=Math.round(bonus*(1+(S.rel.fans-50)*0.004));}
 S.medals+=medals;
 /* relaciones y seguidores */
 if(mins>0){var res=gf>gc?1:gf<gc?-1:0;rel('team',res);rel('fans',res+(g?1:0));rel('coach',r>=7?1:r<5?-2:0);rel('press',(g>=2?2:0)+(r>=8.5?1:0)+(r<4.5?-1:0));
  S.fol=Math.round(S.fol*(1+0.002+Math.max(0,r-6)*0.003+g*0.01+me.str/100*0.002));}
 else S.fol=Math.round(S.fol*1.002);
 var inj=0;
 S.energy=Math.max(0,S.energy-mins/90*22*(1+tx('drain')));
 if(mins>0){var p=(S.energy<35?0.07:0.02)*(mins/90)*(1-0.3*itemLvl('physio'));
  if(Math.random()<p){inj=2+Math.floor(Math.random()*4);if(itemLvl('physio'))inj=Math.max(2,inj-itemLvl('physio'));S.injured=inj;logm('Te lesionas. Baja de '+(inj-1)+' semana(s).');}}
 var st=S.stats,ss=S.ss;
 if(mins>0){st.pj++;ss.pj++;st.min+=mins;st.g+=g;ss.g+=g;st.a+=asi;ss.a+=asi;st.rsum+=r;st.rn++;ss.rsum+=r;ss.rn++;st.sv+=saves;
  if((pos==='POR'||P.df)&&gc===0&&mins>=60)st.cs++;}
 var decs=M.decs.map(function(d){return {min:d.min,n:d.opts[d.done].n,ok:d.ok,res:d.res};});
 return {home:S.clubs[h].name,away:S.clubs[a].name,gh:gh,ga:ga,role:role,mins:mins,r:r,g:g,a:asi,saves:saves,gains:gains,pts:pts,bonus:bonus,medals:medals,evs:evs,inj:inj,wk:S.week+1,decs:decs};
}

function endSeason(){
 var tb=table(),pos=tb.findIndex(function(c){return c.id===S.clubId;})+1,me=S.clubs[S.clubId];
 var sm={season:S.season,pos:pos,club:me.name,champion:pos===1,prize:0,award:false,age:S.age,renew:false,retire:false,ovBefore:overall(),apps:S.ss.pj,g:S.ss.g,a:S.ss.a,rating:S.ss.rn?S.ss.rsum/S.ss.rn:0};
 var w=S.contract.wage;
 sm.prize=pos===1?w*12:pos<=4?w*5:pos<=10?w*2:0;
 if(pos===1)S.stats.titles++;
 if(sm.rating>=7.5&&S.ss.pj>=25){sm.award=true;sm.prize+=w*8;S.medals+=10;}
 S.money+=sm.prize;
 S.hist.push({season:S.season,age:S.age,club:me.name,pos:pos,apps:S.ss.pj,g:S.ss.g,a:S.ss.a,rating:sm.rating,ov:sm.ovBefore});
 logm('Fin de temporada '+S.season+': '+pos+'º puesto con '+me.name+(sm.champion?' (campeones)':'')+'.');
 /* edad y declive físico */
 S.age++;
 Object.keys(S.rel).forEach(function(k){S.rel[k]=Math.round((S.rel[k]+(50-S.rel[k])*0.15)*10)/10;});
 if(S.age>=31)S.skills.forEach(function(k){if(PHYS[k.id])k.pen+=Math.round((S.age-30)*0.8*10)/10;});
 /* contrato */
 S.contract.years--;
 if(S.contract.years<=0){S.contract.years=2;S.contract.wage=wageFor(me.str,overall());sm.renew=true;logm('Renuevas con '+me.name+' dos años. Nuevo salario: '+fmt(S.contract.wage)+'.');}
 /* nueva temporada */
 S.clubs.forEach(function(c){c.str=clamp(c.str+Math.round(norm()*1.6),26,88);c.pts=c.pj=c.gf=c.gc=0;});
 S.clubs.forEach(ageRoster);
 S.fixtures=makeFixtures(20);S.season++;S.week=0;S.energy=100;S.injured=0;
 S.ss={pj:0,g:0,a:0,rsum:0,rn:0};
 genOffers();
 sm.ovAfter=overall();
 if(S.age>=40){sm.retire=true;S.retired=true;}
 S.summary=sm;
}

/* acciones */
function playN(n){
 if(S.summary||S.retired||S.match)return;
 batch={n:0,pts:0,money:0,medals:0};
 var c=0;
 while(c<n&&S.week<WEEKS&&!S.summary){playOne(n===1);c++;if(S.match)break;}
 var b=batch;batch=null;
 save();render();
 if(b.n>1)toast(b.n+' jornadas: +'+b.pts+' puntos, '+fmt(b.money)+', '+b.medals+' medallas');
}
function bonoCost(){return 10000+3000*(S.bono/2);}
function bono(){if(S.bono>=70){toast('Bono al máximo.',1);return;}var c=bonoCost();if(S.money<c){toast('Te faltan '+fmt(c-S.money)+'.',1);return;}S.money-=c;S.bono+=2;save();render();}
function accept(i){
 var o=S.offers[i];if(!o)return;
 if(!windowOpen()){toast('El mercado está cerrado. Abre en las jornadas 1 a 3 y 19 a 21.',1);return;}
 var cl=S.clubs[o.club];S.clubId=o.club;S.contract={wage:o.wage,years:o.years};S.money+=o.bonus;
 logm('Fichas por '+cl.name+'. Salario '+fmt(o.wage)+' por semana, '+o.years+' año(s).');
 S.offers=[];genOffers();toast('Fichas por '+cl.name);save();render();
}
function buy(id){
 var it=SHOP.filter(function(s){return s.id===id;})[0],l=itemLvl(id);
 if(l>=3){return;}var c=it.c[l];
 if(S.money<c){toast('Te faltan '+fmt(c-S.money)+'.',1);return;}
 S.money-=c;S.items[id]=l+1;logm('Compras '+it.n+' (nivel '+(l+1)+').');save();render();
}
function invest(id){
 var v=INVEST.filter(function(s){return s.id===id;})[0];
 if(S.invest[id])return;if(S.money<v.c){toast('Te faltan '+fmt(v.c-S.money)+'.',1);return;}
 S.money-=v.c;S.invest[id]=1;logm('Inviertes en: '+v.n+'.');save();render();
}
function deal(id){
 var v=DEALS.filter(function(s){return s.id===id;})[0];
 if(S.deals[id])return;if(overall()<v.req){toast('Necesitas valoración '+v.req+'.',1);return;}
 S.deals[id]=1;logm('Firmas patrocinio con '+v.n+'.');toast('Patrocinio firmado: '+v.n);save();render();
}

/* vistas */
function stars(l){var f=Math.min(5,Math.ceil(l/(MAXL/5))),s='';for(var i=0;i<5;i++)s+=i<f?'★':'<em>★</em>';return s;}
function topHTML(){
 var ov=overall();
 return '<div id="top"><div class="stat"><span class="star">★</span><span class="num">'+ds(ov)+'</span></div>'+
  '<div class="stat money num">'+fmt(S.money)+'</div>'+
  '<div class="stat"><span class="medal"></span><span class="num">'+S.medals+'</span></div>'+
  '<div class="when"><b>'+esc(S.name)+'</b>'+POS[S.pos]+' · '+S.age+' años · Temp. '+S.season+' · J'+Math.min(S.week+1,WEEKS)+'</div></div>';
}
function viewMatch(){
 if(S.retired)return '<div class="card"><h2>Carrera terminada</h2><p>Mira tu resumen en la pestaña Carrera.</p></div>';

function skVal(k){return Math.max(1,k.base+(k.lvl-1)*5-k.pen+tb(k.id));}
function costFor(k,n){var cap=capFor(k),l=k.lvl,p=k.prog,sum=0;for(var i=0;i<n;i++){if(l>=cap)break;sum+=pointCost(k,l);p++;if(p>=need(l)){p=0;l++;}}return Math.round(sum);}
function addProg(k,n){var cap=capFor(k),up=0;while(n>0&&k.lvl<cap){k.prog++;n--;if(k.prog>=need(k.lvl)){k.prog=0;k.lvl++;up++;}}if(k.lvl>=cap)k.prog=0;return up;}
function train(id){
 var k=S.skills.filter(function(s){return s.id===id;})[0];
 if(k.lvl>=capFor(k)){toast(k.lvl>=MAXL?'Habilidad al máximo.':'Tus rasgos limitan esta habilidad al nivel '+capFor(k)+'.',1);return;}
 var n=S.mult,done=0,up=0;
 for(var i=0;i<n;i++){var c=pointCost(k,k.lvl);if(S.money<c)break;S.money-=c;up+=addProg(k,1);done++;if(k.lvl>=capFor(k))break;}
 if(!done){toast('No tienes dinero para entrenar '+k.n+'.',1);return;}
 if(up){toast(k.n+' sube a nivel '+k.lvl,0);logm(k.n+' sube a nivel '+k.lvl+'.');}
 save();render();
}
function promo(id){
 var k=S.skills.filter(function(s){return s.id===id;})[0];
 if(k.lvl>=capFor(k)){toast('Esta habilidad ya está en su límite.',1);return;}
 var c=need(k.lvl)-k.prog;
 if(S.medals<c){toast('Necesitas '+c+' medallas y tienes '+S.medals+'.',1);return;}
 S.medals-=c;addProg(k,c);toast(k.n+' sube a nivel '+k.lvl,0);logm(k.n+' sube a nivel '+k.lvl+' con medallas.');save();render();
}

 });
 h+='<div class="bono"><div class="card" style="margin:0"><div class="rowb"><b>Bono '+(S.pos==='POR'?'1v1':'de duelo')+'</b><span class="good num">+'+S.bono+' / 70</span></div><div class="bar big"><i style="width:'+(S.bono/70*100)+'%"></i></div><div class="small mut" style="margin-top:4px">Mejora tu nota en cada partido. Cada subida suma 2.</div></div>'+

function mkPlayer(pos,first,young){
 var d=first?Math.round(-2+Math.random()*9):-Math.round(3+Math.random()*10);

function setOv(c){c.ros.forEach(function(p){p.o=clamp(Math.round(c.str+p.d),12,97);});}
function genRoster(c){var seen={};c.ros=SLOTS.map(function(pos){var first=!seen[pos];seen[pos]=1;return mkPlayer(pos,first,false);});setOv(c);}
function ageRoster(c){
 c.ros=c.ros.map(function(p){p.a++;p.d+=p.a<=24?1.2:p.a>=31?-1.5:0;if(p.a>=36)return mkPlayer(p.p,p.f,true);return p;});
 setOv(c);
}
function wpick(c,ex,key){
 var tot=0,w=c.ros.map(function(p){var x=(POSD[p.p][key]+0.01)*(p.o/50)*(p.f?1:0.25);if(p.n===ex)x=0;tot+=x;return x;}),r=Math.random()*tot;
 for(var i=0;i<w.length;i++){r-=w[i];if(r<=0)return c.ros[i];}
 return c.ros[c.ros.length-1];
}
function pickP(c,ex){return wpick(c,ex,'sg');}
function pickA(c,ex){return wpick(c,ex,'sa');}
function rival(c){var best=null;c.ros.forEach(function(p){if(p.p===S.pos&&(!best||p.o>best.o))best=p;});return best;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pskills(p){var r=rng(p.s);return (p.p==='POR'?SKG:SKO).map(function(s){var w=skW(p.p,s[0],s[2]);return {id:s[0],n:s[1],cat:s[2],v:Math.round(clamp(p.o+(w-2.5)*3.5+(r()-.5)*12,8,97))};});}
